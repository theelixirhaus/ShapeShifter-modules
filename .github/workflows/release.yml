name: Build and Release Plugin

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create plugin zip
        run: |
          mkdir -p shapeshifter-modules
          rsync -r --exclude='.git' \
                   --exclude='.github' \
                   --exclude='*.zip' \
                   ./ shapeshifter-modules/
          zip -r shapeshifter-modules.zip shapeshifter-modules/

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: shapeshifter-modules.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}